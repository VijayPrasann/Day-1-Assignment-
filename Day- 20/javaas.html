<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Loop Programs</title>
</head>

<body>

    <h1>JavaScript Loop Programs</h1>

    <h2>1. Series 1 to 20</h2>
    <p id="program1"></p>

    <h2>2. Odd Numbers 1 to 20</h2>
    <p id="program2"></p>

    <h2>3. Even Numbers 0 to 20</h2>
    <p id="program3"></p>

    <h2>4. 5 Series</h2>
    <p id="program4"></p>

    <h2>5. Sum of 1 to 20</h2>
    <p id="program5"></p>

    <h2>6. Sum of Even Numbers</h2>
    <p id="program6"></p>

    <h2>7. Sum of Odd Numbers</h2>
    <p id="program7"></p>

    <h2>8. Sum of 5 Series</h2>
    <p id="program8"></p>

    <h2>9. 1/1! + 2/2! + 3/3! + 4/4!</h2>
    <p id="program9"></p>

    <h2>10. 0/0! + 2/2! + 4/4! + 6/6!</h2>
    <p id="program10"></p>

    <h2>11. 1/1! + 3/3! + 5/5!</h2>
    <p id="program11"></p>


    <script>

        // ==================================================
        // 1. 1 2 3 4 5 ... 20
        // Using FOR loop
        // ==================================================

        let output1 = "";

        for (let i = 1; i <= 20; i++) {
            output1 = output1 + i + " ";
        }

        document.getElementById("program1").innerHTML = output1;


        // ==================================================
        // 2. Odd numbers 1 to 20
        // Using WHILE loop
        // ==================================================

        let output2 = "";
        let i = 1;

        while (i <= 20) {

            if (i % 2 != 0) {
                output2 = output2 + i + " ";
            }

            i++;
        }

        document.getElementById("program2").innerHTML = output2;


        // ==================================================
        // 3. Even numbers 0 to 20
        // Using DO WHILE loop
        // ==================================================

        let output3 = "";
        let j = 0;

        do {

            if (j % 2 == 0) {
                output3 = output3 + j + " ";
            }

            j++;

        } while (j <= 20);

        document.getElementById("program3").innerHTML = output3;


        // ==================================================
        // 4. 5 Series
        // 0 5 10 15 20 25
        // Using FOR loop
        // ==================================================

        let output4 = "";

        for (let i = 0; i <= 25; i = i + 5) {
            output4 = output4 + i + " ";
        }

        document.getElementById("program4").innerHTML = output4;


        // ==================================================
        // 5. 1 + 2 + 3 + 4 + ...
        // Using WHILE loop
        // ==================================================

        let sum5 = 0;
        let n5 = 1;

        while (n5 <= 20) {

            sum5 = sum5 + n5;

            n5++;
        }

        document.getElementById("program5").innerHTML =
            "Sum = " + sum5;


        // ==================================================
        // 6. 0 + 2 + 4 + 6 + ...
        // Using DO WHILE loop
        // ==================================================

        let sum6 = 0;
        let n6 = 0;

        do {

            sum6 = sum6 + n6;

            n6 = n6 + 2;

        } while (n6 <= 20);

        document.getElementById("program6").innerHTML =
            "Sum = " + sum6;


        // ==================================================
        // 7. 1 + 3 + 5 + 7 + ...
        // Using FOR loop
        // ==================================================

        let sum7 = 0;

        for (let i = 1; i <= 20; i = i + 2) {

            sum7 = sum7 + i;
        }

        document.getElementById("program7").innerHTML =
            "Sum = " + sum7;


        // ==================================================
        // 8. 0 + 5 + 10 + 15 + 20 + ...
        // Using WHILE loop
        // ==================================================

        let sum8 = 0;
        let n8 = 0;

        while (n8 <= 20) {

            sum8 = sum8 + n8;

            n8 = n8 + 5;
        }

        document.getElementById("program8").innerHTML =
            "Sum = " + sum8;


        // ==================================================
        // 9. 1/1! + 2/2! + 3/3! + 4/4!
        // Using FOR loop
        // ==================================================

        let sum9 = 0;
        let factorial9 = 1;

        for (let i = 1; i <= 4; i++) {

            factorial9 = factorial9 * i;

            sum9 = sum9 + (i / factorial9);
        }

        document.getElementById("program9").innerHTML =
            "Answer = " + sum9;


        // ==================================================
        // 10. 0/0! + 2/2! + 4/4! + 6/6!
        // Using WHILE loop
        // ==================================================

        let sum10 = 0;
        let factorial10 = 1;
        let n10 = 0;

        while (n10 <= 6) {

            if (n10 == 0) {
                factorial10 = 1;
            }
            else {
                factorial10 = factorial10 * (n10 - 1) * n10;
            }

            sum10 = sum10 + (n10 / factorial10);

            n10 = n10 + 2;
        }

        document.getElementById("program10").innerHTML =
            "Answer = " + sum10;


        // ==================================================
        // 11. 1/1! + 3/3! + 5/5!
        // Using DO WHILE loop
        // ==================================================

        let sum11 = 0;
        let factorial11 = 1;
        let n11 = 1;

        do {

            factorial11 = 1;

            for (let j = 1; j <= n11; j++) {
                factorial11 = factorial11 * j;
            }

            sum11 = sum11 + (n11 / factorial11);

            n11 = n11 + 2;

        } while (n11 <= 5);

        document.getElementById("program11").innerHTML =
            "Answer = " + sum11;

    </script>

</body>
</html>
