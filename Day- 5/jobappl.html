<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Application Form</h1>

    <form action="Details.html"  method="get">
    
    <label for="Fullname">Fullname</label>
    <input type="text" id="Fullname" name="Fullname"><br><br></input>

    <label for="Email">Email</label>
    <input type="Email" id="Email" name="Email"><br></br></input>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone"><br><br></input>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob"><br></br><input>

    <label for="gender">Gender</label>
    <input type="radio" id="male" name="gender" value="male"><br></br></input>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label> 

    <label for="Qualification">Qualification</label>
    <select id="Qualification" name="Qualification">
        <option value="highschool">High School</option>
        <option value="bachelor">Bachelor's Degree</option>
        <option value="master">Master's Degree</option>
        <option value="phd">PhD</option>

    </select>
    <br></br>

    <label for="skills">skills</label>
    <input type="checkbox" id="html" name="skills" ><br></br></input>
    <label for="html">HTML</label>
    <input type="checkbox" id="css" name="skills">
    <label for="css">css</label>
    <input type="checkbox" id="javascript" name="skills">
    <label for="javascript">JavaScript</label>

    <label for="exp">Years of Experience</label>
    <input type=""number" id="exp" name="exp">


    <label for="resume">Resume</label>
    <input type="file" id="resume" name="resume">
    <input value="submit" type="submit">

    </form>


    
</body>
</html>
